name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: >
          dotnet restore Skopka.Hello.slnx
          --configfile NuGet.Config

      - name: Build
        run: >
          dotnet build Skopka.Hello.slnx
          --configuration Release
          --no-restore

      - name: Install browser test runtime
        run: >
          pwsh tests/Skopka.Hello.BrowserTests/bin/Release/net10.0/playwright.ps1
          install --with-deps chromium

      - name: Verify formatting
        run: >
          dotnet format Skopka.Hello.slnx
          --no-restore
          --verify-no-changes

      - name: Test
        run: >
          dotnet test Skopka.Hello.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory artifacts/test-results

      - name: Audit NuGet dependencies
        run: >
          dotnet list Skopka.Hello.slnx package
          --vulnerable
          --include-transitive
          --no-restore

      - name: Determine package version
        id: package_version
        shell: bash
        run: |
          VERSION="$(dotnet msbuild src/Skopka.Hello/Skopka.Hello.csproj -getProperty:PackageVersion -nologo)"
          if [[ -z "$VERSION" ]]; then
            echo "The package version could not be determined." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack Skopka.Hello.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:WarnOnPackingNonPackableProject=false

      - name: Verify package set
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          EXPECTED_PACKAGES=(
            "Skopka.Hello"
            "Skopka.Hello.Admin"
            "Skopka.Hello.Endpoints"
            "Skopka.Hello.Oidc"
            "Skopka.Hello.UI"
          )

          for PACKAGE_ID in "${EXPECTED_PACKAGES[@]}"; do
            for EXTENSION in nupkg snupkg; do
              PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.${EXTENSION}"
              if [[ ! -f "$PACKAGE_PATH" ]]; then
                echo "Expected package '$PACKAGE_PATH' was not produced." >&2
                exit 1
              fi
            done
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l)
          if [[ "$NUPKG_COUNT" -ne 5 || "$SNUPKG_COUNT" -ne 5 ]]; then
            echo "Expected 5 packages and 5 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Restore package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet restore tests/Skopka.Hello.PackageConsumer/Skopka.Hello.PackageConsumer.csproj
          --source "${{ github.workspace }}/artifacts/packages"
          --source "https://api.nuget.org/v3/index.json"
          -p:HelloPackageVersion="$PACKAGE_VERSION"

      - name: Run package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet run
          --project tests/Skopka.Hello.PackageConsumer/Skopka.Hello.PackageConsumer.csproj
          --configuration Release
          --no-restore
          -p:HelloPackageVersion="$PACKAGE_VERSION"

      - name: Build server container
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          docker build .
          --file src/Skopka.Hello.Server/Dockerfile
          --build-arg RELEASE_VERSION="$PACKAGE_VERSION"
          --tag skopka-hello:ci

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
