x-hello-image: &hello-image
  image: skopka-hello:local
  build:
    context: ..
    dockerfile: src/Skopka.Hello.Server/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skopka_hello}
      POSTGRES_USER: ${POSTGRES_USER:-skopka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *hello-image
    command: ["--migrate"]
    environment:
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=${POSTGRES_DB:-skopka_hello};Username=${POSTGRES_USER:-skopka};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  server:
    <<: *hello-image
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=${POSTGRES_DB:-skopka_hello};Username=${POSTGRES_USER:-skopka};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      SkopkaHello__Jwt__SigningKey: ${SKOPKA_HELLO_JWT_SIGNING_KEY:?Set SKOPKA_HELLO_JWT_SIGNING_KEY in .env}
      SkopkaHello__RateLimiting__Keys__v1: ${SKOPKA_HELLO_RATE_LIMIT_KEY_V1:?Set SKOPKA_HELLO_RATE_LIMIT_KEY_V1 in .env}
      SkopkaHello__Verification__Keys__v1: ${SKOPKA_HELLO_OTP_KEY_V1:?Set SKOPKA_HELLO_OTP_KEY_V1 in .env}
      SkopkaHello__PublicOrigin: ${SKOPKA_HELLO_PUBLIC_ORIGIN:-http://localhost:8080}
      SkopkaHello__SelfRegistration__Enabled: "${SKOPKA_HELLO_SELF_REGISTRATION_ENABLED:-true}"
      SkopkaHello__Ui__PathPrefix: "${SKOPKA_HELLO_UI_PATH_PREFIX:-/hello}"
      SkopkaHello__DataProtection__KeyPath: /var/lib/skopka-hello/keys
      SkopkaHello__Customization__CssFilePath: /var/lib/skopka-hello/customization/custom.css
      SkopkaHello__Cookies__Secure: "false"
      SkopkaHello__Delivery__EmailProviderId: "${SKOPKA_HELLO_EMAIL_PROVIDER_ID:-}"
      SkopkaHello__Delivery__SmsProviderId: "${SKOPKA_HELLO_SMS_PROVIDER_ID:-}"
      SkopkaHello__Delivery__VerificationChannel: "${SKOPKA_HELLO_VERIFICATION_CHANNEL:-Email}"
      SkopkaHello__Delivery__AnonymousRequestQueueCapacity: "${SKOPKA_HELLO_ANONYMOUS_MESSAGE_QUEUE_CAPACITY:-256}"
      SkopkaHello__Delivery__Smtp__ProviderId: "${SKOPKA_HELLO_SMTP_PROVIDER_ID:-smtp}"
      SkopkaHello__Delivery__Smtp__Host: "${SKOPKA_HELLO_SMTP_HOST:-}"
      SkopkaHello__Delivery__Smtp__Port: "${SKOPKA_HELLO_SMTP_PORT:-587}"
      SkopkaHello__Delivery__Smtp__EnableSsl: "${SKOPKA_HELLO_SMTP_ENABLE_SSL:-true}"
      SkopkaHello__Delivery__Smtp__UserName: "${SKOPKA_HELLO_SMTP_USERNAME:-}"
      SkopkaHello__Delivery__Smtp__Password: "${SKOPKA_HELLO_SMTP_PASSWORD:-}"
      SkopkaHello__Delivery__Smtp__FromAddress: "${SKOPKA_HELLO_SMTP_FROM_ADDRESS:-}"
      SkopkaHello__Delivery__Smtp__FromName: "${SKOPKA_HELLO_SMTP_FROM_NAME:-Skopka.Hello}"
      SkopkaHello__Delivery__Smtp__QueueCapacity: "${SKOPKA_HELLO_SMTP_QUEUE_CAPACITY:-256}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data-protection:/var/lib/skopka-hello/keys
      - ./customization:/var/lib/skopka-hello/customization:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "dotnet", "Skopka.Hello.Server.dll", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  data-protection:
